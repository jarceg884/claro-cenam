<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Claro CENAM — real-time local clock demo">
<title>Claro CENAM</title>
<style>
  :root {
    --claro-red: #DA291C;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #ffffff;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--claro-red);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }
  .logo-chip {
    background: #ffffff;
    border-radius: 50%;
    padding: 6px;
    line-height: 0;
    flex-shrink: 0;
  }
  .logo-chip img {
    height: 40px;
    width: 40px;
    border-radius: 50%;
    display: block;
  }
  .wordmark {
    color: #ffffff;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem;
    text-align: center;
  }
  .label {
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 1.5rem;
  }
  #clock {
    font-size: clamp(4rem, 14vw, 8.5rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  #date {
    margin-top: 1.25rem;
    font-size: 1.375rem;
    color: var(--text-secondary);
  }
  footer {
    padding: 1.5rem;
    text-align: center;
    font-size: 0.875rem;
    color: var(--text-secondary);
  }
</style>
</head>
